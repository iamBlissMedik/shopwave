packages:
  - "apps/*"
  - "packages/*"

# Skip the implicit "are deps up to date?" check before every `pnpm run`.
verifyDepsBeforeRun: false

# pnpm 11 blocks dependency build scripts unless each is explicitly allowed here.
# We need Prisma (query engine), esbuild and unrs-resolver (native binaries used
# by tsup/tsx) to build; @scarf/scarf is analytics-only and denied. Leaving any
# of these un-set makes pnpm fail CI with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: true
